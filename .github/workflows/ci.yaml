name: Node.js CI

on: pull_request

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Use dependencies cache
        id: cache
        uses: actions/cache@v5
        with:
          path: ./node_modules
          key: modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund --omit dev

      - run: npm run lint -- --max-warnings 0

      - run: npm run typecheck

  a11y:
    # Cloudflare Pages doesn't build PRs from forks, so there is no preview to test
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Wait for Cloudflare Pages preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          for _ in $(seq 60); do
            check=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | select(.name | test("cloudflare"; "i"))][0]')
            if [ -n "$check" ] && [ "$(jq -r .status <<< "$check")" = completed ]; then
              conclusion=$(jq -r .conclusion <<< "$check")
              [ "$conclusion" = success ] || { echo "Cloudflare Pages check: $conclusion"; exit 1; }
              # prefer the URL Cloudflare reports; fall back to the branch alias (lowercased, non-alphanumerics to '-')
              url=$(jq -r '"\(.output.summary) \(.output.text)"' <<< "$check" \
                | grep -oE 'https://[a-z0-9-]+\.voorhoede-website\.pages\.dev' | head -1)
              url=${url:-https://$(tr '[:upper:]' '[:lower:]' <<< "$BRANCH" | sed 's/[^a-z0-9]/-/g').voorhoede-website.pages.dev}
              echo "Preview: $url"
              echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for the Cloudflare Pages check on $SHA"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - run: npx playwright install --with-deps chromium

      - run: npm run test:a11y -- --reporter=list,json
        env:
          A11Y_BASE_URL: ${{ steps.preview.outputs.url }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: tmp/a11y-results.json

      - name: Comment a11y report on PR
        if: ${{ !cancelled() && hashFiles('tmp/a11y-results.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -r --arg url "$URL" --arg run "$RUN" '
            [.. | objects | select(has("specs")) | .specs[]
              | .tests[0].results[-1] as $r
              | { page: (.title | sub("^a11y "; "")),
                  error: (if $r.status == "passed" then null
                    else ($r.error.message // $r.status | gsub("\u001b\\[[0-9;]*m"; "") | split("\n")[0]) end),
                  violations: ([$r.attachments[] | select(.name == "axe-violations.json") | .body | @base64d | fromjson] | add // []) }]
            | map(select(.error or (.violations | length > 0))) as $bad
            | "<!-- a11y-report -->\n## Accessibility report\n\n"
              + "\($bad | length) of \(length) pages have issues on \($url). [Full log](\($run))\n\n"
              + ($bad | map("- `\(.page)`: " + if .error then "❌ \(.error)"
                  else (.violations | map("**\(.impact)** \(.id) (\(.nodes | length)x)") | join(", ")) end)
                | join("\n"))
          ' tmp/a11y-results.json | head -c 60000 > tmp/a11y-report.md # GitHub caps comments at 65536 chars

          # update our earlier comment instead of adding a new one per push
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.body | startswith("<!-- a11y-report -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@tmp/a11y-report.md
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@tmp/a11y-report.md
          fi
